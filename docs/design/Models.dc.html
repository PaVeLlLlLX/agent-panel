<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Модели и разрешения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#1F1F1F;--bg2:#181818;--surface:#252526;--raised:#2D2D2D;--line:#2B2B2B;--line2:#3C3C3C;--fg:#CCCCCC;--fg-strong:#EDEDED;--muted:#9D9D9D;--accent:#0078D4;--accent-fg:#FFFFFF;--btn2:#313131;--btn2-fg:#CCCCCC;--code:#2B2B2B;--claude:#89D185;--codex:#E8A04C;--warn:#E2C04A;--danger:#F48771;--ok:#89D185;--run:#6CB6FF}
button,select,textarea,input{font:inherit}
</style>
</helmet>
<div class="t-dark" style="width: 560px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.45">
<main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px 14px">
<div style="display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px"><span style="flex-grow: 1; height: 1px; background: var(--line)"></span>Панель · Claude: Opus · high — со следующего хода<span style="flex-grow: 1; height: 1px; background: var(--line)"></span></div>
</main>
<footer style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--bg2)">
<section aria-label="Модели" style="display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface)">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 600; color: var(--fg-strong)">Модели</span><span style="font-size: 12px; color: var(--muted)">меняются со следующего хода</span></div>
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 170px; gap: 8px; align-items: center">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--claude)"></span>Claude</span>
<select aria-label="Модель Claude" style="height: 28px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--btn2); color: var(--fg)"><option>Opus</option><option>по умолчанию (Sonnet 5)</option><option>Sonnet</option><option>Haiku</option></select>
<select aria-label="Уровень рассуждения Claude" style="height: 28px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--btn2); color: var(--fg)"><option>high</option><option>по умолчанию</option><option>max</option></select>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--codex)"></span>Codex</span>
<select aria-label="Модель Codex" style="height: 28px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--btn2); color: var(--fg)"><option>GPT-6-Sol</option><option>по умолчанию (GPT-6-Astra)</option><option>GPT-6-Luna</option></select>
<select aria-label="Уровень рассуждения Codex" style="height: 28px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--btn2); color: var(--fg)"><option>по умолчанию (low)</option><option>high</option><option>ultra</option></select>
</div>
<div style="height: 1px; background: var(--line)"></div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1">Разрешения Claude</span>
<div role="group" aria-label="Разрешения Claude" style="display: inline-flex; padding: 2px; border-radius: 7px; background: var(--btn2)">
<button aria-pressed="true" style="height: 26px; padding: 0 12px; border: 0; border-radius: 5px; background: var(--bg); color: var(--fg-strong); font-weight: 600; cursor: pointer">без вопросов</button>
<button aria-pressed="false" style="height: 26px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer">спрашивать</button>
</div>
</div>
</section>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<button aria-expanded="true" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--fg-strong); font-size: 12px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 5h7M12.5 5h1M2.5 11h2M7.5 11h6"></path><circle cx="11" cy="5" r="1.5"></circle><circle cx="6" cy="11" r="1.5"></circle></svg>Модели</button>
<span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted)">Claude: Opus · high · Codex: GPT-6-Sol · разрешения: без вопросов</span>
</div>
<textarea aria-label="Сообщение" rows="3" placeholder="Сообщение… Ctrl+Enter отправляет" style="box-sizing: border-box; width: 100%; resize: none; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); color: var(--fg)"></textarea>
<div style="display: flex; align-items: center; gap: 8px">
<label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted)">Режим<select style="height: 28px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--btn2); color: var(--fg)"><option>Задача с рецензией</option><option>Спросить обоих</option><option>Только Claude</option><option>Только Codex</option></select></label>
<span style="flex-grow: 1"></span>
<button style="height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer">Отправить</button>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
