<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уровень рассуждения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width: 360px; height: 150px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; border-radius: 18px; background: #262626; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); color: #D6D6D6; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 13px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<span style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; color: #8E8E8E"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 3.5 9h4l-1 5.5L12.5 7h-4z"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 1px">
<button style="display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: {{titleColor}}; font-size: 15px; font-weight: 600; cursor: pointer">{{label}}<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"></path></svg></button>
<span style="font-size: 12px; color: #8E8E8E">{{model}}</span>
</div>
<button aria-label="Вернуть уровень по умолчанию" onClick="{{reset}}" style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #8E8E8E; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.5v2.8h2.8"></path></svg></button>
</div>
<div style="position: relative; height: 36px; border-radius: 18px; background: #3A3A3A">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fillWidth}}; border-radius: 18px; background: {{fill}}; overflow: hidden">
<sc-if value="{{stars}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 24px; top: 9px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.85)"></span>
<span style="position: absolute; left: 48px; top: 22px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.6)"></span>
<span style="position: absolute; left: 77px; top: 12px; width: 1px; height: 1px; border-radius: 50%; background: rgba(255, 255, 255, 0.9)"></span>
<span style="position: absolute; left: 103px; top: 25px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.7)"></span>
<span style="position: absolute; left: 131px; top: 8px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.8)"></span>
<span style="position: absolute; left: 158px; top: 19px; width: 1px; height: 1px; border-radius: 50%; background: rgba(255, 255, 255, 0.9)"></span>
<span style="position: absolute; left: 186px; top: 11px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.65)"></span>
<span style="position: absolute; left: 212px; top: 24px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.8)"></span>
<span style="position: absolute; left: 238px; top: 7px; width: 1px; height: 1px; border-radius: 50%; background: rgba(255, 255, 255, 0.9)"></span>
<span style="position: absolute; left: 263px; top: 18px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.7)"></span>
<span style="position: absolute; left: 287px; top: 10px; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.55)"></span>
</sc-if>
</div>
<sc-for list="{{dots}}" as="dot" hint-placeholder-count="6">
<button aria-label="{{dot.name}}" onClick="{{dot.pick}}" style="position: absolute; top: 0; left: {{dot.hit}}; width: 36px; height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 50%; background: {{dot.color}}"></span></button>
</sc-for>
<span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); pointer-events: none"></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","options":["codex","claude"],"default":"codex"},"model":{"editor":"text","default":"Codex · GPT-6 Sol"},"start":{"editor":"int","default":5,"min":0,"max":5},"$preview":{"width":360,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const набор = (this.props.preset ?? 'codex') === 'claude'
      ? ['Низкое', 'Среднее', 'Высокое', 'Очень высокое', 'Максимум']
      : ['Низкое', 'Среднее', 'Высокое', 'Очень высокое', 'Максимум', 'Ультра'];
    const исходный = Math.min(набор.length - 1, Math.max(0, Number(this.props.start ?? набор.length - 1)));
    const выбран = this.state && this.state.level != null ? this.state.level : исходный;
    const шаг = 292 / (набор.length - 1);
    const центр = (i) => 18 + i * шаг;
    const цвет = { 'Низкое': '#A0A0A0', 'Среднее': '#8AB8FF', 'Высокое': '#6AA5FF', 'Очень высокое': '#4C8DF6', 'Максимум': '#A68BFA', 'Ультра': '#BBA2FF' };
    const заливка = {
      'Низкое': '#5E5E5E',
      'Среднее': '#3F74C9',
      'Высокое': '#3E7EE6',
      'Очень высокое': '#4C8DF6',
      'Максимум': 'linear-gradient(90deg, #5B63EE 0%, #9C7CF6 100%)',
      'Ультра': 'linear-gradient(90deg, #4B55D6 0%, #6E63F2 40%, #A57BF4 72%, #D98AD9 100%)'
    };
    const имя = набор[выбран];
    return {
      label: имя,
      model: this.props.model ?? 'Codex · GPT-6 Sol',
      titleColor: цвет[имя],
      fill: заливка[имя],
      fillWidth: (центр(выбран) + 18) + 'px',
      knobLeft: (центр(выбран) - 15) + 'px',
      stars: имя === 'Ультра',
      dots: набор.map((n, i) => ({
        name: n,
        hit: (центр(i) - 18) + 'px',
        color: i <= выбран ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.28)',
        pick: () => this.setState({ level: i })
      })),
      reset: () => this.setState({ level: null })
    };
  }
}
</script>
</body>
</html>
